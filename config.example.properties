# ============================================================
# ПРИМЕР конфигурации. Эти строки нужно добавить в local.properties
# (local.properties НЕ коммитится в git - он в .gitignore).
# ============================================================

# Путь к Android SDK (создаётся автоматически)
sdk.dir=C\:\\Android

# --- Telegram API (получить на https://my.telegram.org -> API development tools) ---
tg.apiId=0
tg.apiHash=PLACEHOLDER_API_HASH

# --- MTProto-прокси (Fake TLS) на Railway ---
# host: домен или IP сервера
# port: порт прокси
# secret: секрет с префиксом "ee" (Fake TLS)
proxy.host=PLACEHOLDER_HOST
proxy.port=443
proxy.secret=PLACEHOLDER_SECRET

# --- Обновления из GitHub Releases (Этап 8) ---
# Репозиторий в формате owner/repo
update.repo=PLACEHOLDER_OWNER/PLACEHOLDER_REPO

# --- Подпись release-сборок ---
# Файл ключа и пароли НИКОГДА не коммитить. Потеря ключа = семье придётся
# переустанавливать приложение вручную (обновления перестанут ставиться).
keystore.file=keystore/fork-release.jks
keystore.alias=fork
keystore.password=PLACEHOLDER
keystore.keyPassword=PLACEHOLDER
